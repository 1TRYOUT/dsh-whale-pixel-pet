<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>鲸鱼娘立绘 · 接触印相</title>
<style>
  html, body { margin: 0; background: #0e1622; color: #cfe0ff; font: 12px/1.4 Consolas, "Microsoft YaHei", monospace; }
  h1 { font-size: 14px; margin: 10px 12px 4px; color: #7fd4ff; font-weight: 600; }
  #wrap { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 12px; }
  .cell { width: 238px; background: #16202e; border-radius: 10px; text-align: center; padding: 4px 0 0; }
  .cell img { width: 230px; height: 230px; display: block; margin: 0 auto; image-rendering: auto; }
  .cap { font-size: 11px; color: #8fb0d8; padding: 2px 0 4px; word-break: break-all; }
  /* 参考框：512 画面里的安全区（底部对齐、正中） */
  .box { position: relative; }
</style>
</head>
<body>
<h1>鲸鱼娘立绘接触印相（512×512 原图，等比缩到 230px）· 用于确认人物在画面中的位置</h1>
<div id="wrap"></div>
<script>
  const NAMES = [
    'dsh-whale-state-idle-cute', 'dsh-whale-state-tool', 'dsh-whale-state-thinking',
    'dsh-whale-state-waiting', 'dsh-whale-state-react-head', 'dsh-whale-state-react-belly',
    'dsh-whale-state-react-tail', 'dsh-whale-state-eat', 'dsh-whale-state-sleep',
    'dsh-whale-state-pick-up', 'dsh-whale-state-failure', 'dsh-whale-state-levelup',
    'dsh-whale-state-greet', 'dsh-whale-state-work-deploy', 'dsh-whale-state-work-debug',
    'dsh-whale-state-work-review', 'dsh-whale-state-daily-coffee', 'dsh-whale-state-star'
  ];
  const wrap = document.getElementById('wrap');
  for (const n of NAMES) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    const box = document.createElement('div');
    box.className = 'box';
    const img = document.createElement('img');
    img.src = '../assets/art/musume/' + n + '.webp';
    img.alt = n;
    box.appendChild(img);
    cell.appendChild(box);
    const cap = document.createElement('div');
    cap.className = 'cap';
    cap.textContent = n.replace('dsh-whale-state-', '');
    cell.appendChild(cap);
    wrap.appendChild(cell);
  }
</script>
</body>
</html>
