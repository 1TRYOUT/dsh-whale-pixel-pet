<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>鲸鱼娘桌宠</title>
<style>
  /* 这个窗口整体透明，只画出她本人和气泡；其余区域的点击由主进程穿透到桌面 */
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: transparent; overflow: hidden;
    -webkit-user-select: none; user-select: none;
    cursor: default;
  }
  #stage { display: block; position: absolute; inset: 0; }
  #bubble {
    position: absolute;
    display: none;
    max-width: 220px;
    padding: 6px 10px;
    transform: translate(-50%, -100%);
    background: rgba(22, 32, 44, 0.94);
    color: #dce9f7;
    border: 1px solid rgba(160, 200, 240, 0.22);
    border-radius: 12px;
    box-shadow: 0 10px 26px rgba(0, 0, 0, 0.38);
    font: 12.5px/1.45 "Segoe UI", "Microsoft YaHei", sans-serif;
    white-space: pre-wrap;
    pointer-events: none;
  }
  #bubble::after {
    content: ""; position: absolute; left: 50%; bottom: -6px; width: 10px; height: 10px;
    margin-left: -5px; background: rgba(22, 32, 44, 0.94);
    border-right: 1px solid rgba(160, 200, 240, 0.22);
    border-bottom: 1px solid rgba(160, 200, 240, 0.22);
    transform: rotate(45deg);
  }
  /* 任务 / 进度 / 用量 HUD：只读展示，绝不参与命中（pointer-events:none） */
  #hud {
    position: absolute; left: 10px; right: 10px; bottom: 22px;
    display: none;
    padding: 6px 9px; border-radius: 10px;
    background: rgba(14, 22, 32, 0.74);
    border: 1px solid rgba(140, 190, 240, 0.18);
    color: #cfe0f2;
    font: 11.5px/1.55 "Segoe UI", "Microsoft YaHei", sans-serif;
    white-space: pre-line;
    pointer-events: none;
  }
  /* 顶部一条极淡的状态指示，鼠标不在她身上时也能看出 DSH 忙不忙 */
  #hint {
    position: absolute; left: 0; right: 0; bottom: 4px; text-align: center;
    font: 11px/1.4 "Segoe UI", "Microsoft YaHei", sans-serif;
    color: rgba(200, 220, 240, 0.42);
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="bubble"></div>
<div id="hud"></div>
<div id="hint"></div>

<script src="../assets/whale-pet.js"></script>
<script src="../assets/pet-actions.js"></script>
<script src="../assets/art-musume.js"></script>
<script src="renderer.js"></script>
</body>
</html>
