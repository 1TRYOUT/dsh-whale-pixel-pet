<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>桌宠渲染回归测试：拖动不留重影</title>
<link rel="stylesheet" href="../assets/whale-pet.css">
<style>
  html, body { margin: 0; height: 100%; background: #0e1622; color: #cfe0ff;
    font: 12.5px/1.5 Consolas, "Microsoft YaHei", monospace; }
  #result { white-space: pre; padding: 10px; position: relative; z-index: 1; }
  .ok { color: #7fe0a0; } .bad { color: #ff8080; } .dim { color: #6f8aa8; }
</style>
</head>
<body>
<pre id="result">running…</pre>

<script src="../assets/whale-pet.js"></script>
<script src="../assets/host-signal.js"></script>
<script src="../assets/art-musume.js"></script>
<script src="../assets/whale-pet-overlay.js"></script>
<script>
(function () {
  var out = [], pass = 0, fail = 0;
  function emit(t, c) { out.push({ t: t, c: c || 'dim' }); }
  function check(name, cond, extra) {
    if (cond) { pass++; emit('PASS  ' + name, 'ok'); }
    else { fail++; emit('FAIL  ' + name + (extra !== undefined ? '  → ' + extra : ''), 'bad'); }
  }
  function flush() {
    document.getElementById('result').innerHTML = out.map(function (l) {
      return '<span class="' + l.c + '">' + l.t.replace(/[<>&]/g, function (c) {
        return { '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c];
      }) + '</span>';
    }).join('\n') + '\n\n' + (fail === 0 ? 'ALL PASS (' + pass + ')' : 'FAILED ' + fail + ' / ' + (pass + fail));
    console.log('[ghost] RESULT: ' + (fail === 0 ? ('ALL PASS (' + pass + ')') : ('FAILED ' + fail + ' / ' + (pass + fail))));
    out.forEach(function (l) { if (l.c === 'bad') console.log('[ghost] ' + l.t); });
  }

  var overlay = window.WhalePetOverlay.createOverlay({
    storageKey: 'whale-pet:ghost',
    assetBase: '../assets/',
    config: { art: 'pixel', sound: false, bubble: false, guiPet: true },
    win: window, doc: document
  });
  overlay.load = function () { return this; };
  overlay.save = function () { return {}; };
  overlay.mount();

  var ctx = overlay.ctx;
  function alphaAt(x, y) {
    try { return ctx.getImageData(Math.round(x), Math.round(y), 1, 1).data[3]; }
    catch (e) { return -1; }
  }
  /** 采样一条水平线上有多少个不透明点（用来找残影） */
  function inkCount(y, x0, x1, step) {
    var n = 0;
    for (var x = x0; x <= x1; x += (step || 4)) {
      var a = alphaAt(x, y);
      if (a < 0) return -1;
      if (a > 0) n++;
    }
    return n;
  }

  /* ---------------- 0. 对照组：不清屏就会留重影（自证断言有效） ---------------- */
  emit('=== 0. 对照组：故意不清屏 ===');
  var y0 = Math.round(overlay.pet.floorY() - 60);
  var r0 = overlay.pet.xRange();
  var cA = r0.min + 30, cB = r0.max - 30;
  var realClear = overlay.clear;
  overlay.clear = function () { return this; };      // 故意不擦画布
  overlay.pet.x = cA; overlay.pet.y = overlay.pet.floorY();
  overlay.frame(1 / 60);
  overlay.pet.x = cB;
  overlay.frame(1 / 60);
  var ghostSeen = alphaAt(cA, y0) > 0;
  overlay.clear = realClear;                          // 恢复清屏
  check('对照组：不清屏时旧位置确实会留下重影（证明下面这条断言抓得住）', ghostSeen === true,
    'alpha=' + alphaAt(cA, y0));

  /* ---------------- 1. 像素画风：搬走之后旧位置必须干净 ---------------- */
  emit('');
  emit('=== 1. 像素画风 ===');
  var y = Math.round(overlay.pet.floorY() - 60);
  var rng = overlay.pet.xRange();               // 她会被夹在这个区间内，探针必须取在里面
  emit('# 视口 ' + window.innerWidth + 'x' + window.innerHeight + '，可站区间 x ∈ [' +
    Math.round(rng.min) + ', ' + Math.round(rng.max) + ']');
  var xA = rng.min + 30, xB = rng.max - 30;

  overlay.pet.x = xA; overlay.pet.y = overlay.pet.floorY();
  overlay.frame(1 / 60);
  check('第一帧：当前位置有像素', alphaAt(overlay.pet.x, y) > 0, 'alpha=' + alphaAt(overlay.pet.x, y));

  overlay.pet.x = xB;
  overlay.frame(1 / 60);
  check('搬走后旧位置完全透明（无重影）', alphaAt(xA, y) === 0, 'alpha=' + alphaAt(xA, y));
  check('新位置正常画上', alphaAt(xB, y) > 0, 'alpha=' + alphaAt(xB, y));

  // 整条扫描线：只该有她那一处墨迹
  overlay.pet.x = Math.round((rng.min + rng.max) / 2);
  overlay.pet.y = overlay.pet.floorY();
  overlay.frame(1 / 60);
  var inkPixels = inkCount(y, 20, window.innerWidth - 20, 4);
  check('整行只有她一处墨迹（无沿途残影）', inkPixels > 0 && inkPixels < 60, '不透明采样点=' + inkPixels);

  /* ---------------- 2. 连续拖动（模拟真实拖拽） ---------------- */
  emit('');
  emit('=== 2. 连续拖动 40 帧 ===');
  var startX = rng.min + 10;
  for (var i = 0; i < 40; i++) {
    overlay.pet.x = Math.min(rng.max, startX + i * 14);
    overlay.frame(1 / 60);
  }
  var here = overlay.pet.x;
  var residue = 0;
  for (var x2 = 20; x2 <= window.innerWidth - 20; x2 += 6) {
    if (x2 > here - 80 && x2 < here + 80) continue;      // 跳过她当前占据的范围
    if (alphaAt(x2, y) > 0) residue++;
  }
  check('拖动 40 帧后，沿途没有残影', residue === 0, '残留采样点=' + residue);
  check('她现在被画在新位置', alphaAt(here, y) > 0, 'alpha=' + alphaAt(here, y));

  /* ---------------- 3. 上下移动 + 甩出去（含影子） ---------------- */
  emit('');
  emit('=== 3. 垂直移动与留影 ===');
  overlay.pet.x = Math.round((rng.min + rng.max) / 2);
  overlay.pet.y = overlay.pet.floorY() - 200;
  overlay.frame(1 / 60);
  var midTop = Math.round(overlay.pet.floorY() - 200 - 60);
  check('悬空时高位有像素', alphaAt(overlay.pet.x, midTop) > 0, 'alpha=' + alphaAt(overlay.pet.x, midTop));

  overlay.pet.y = overlay.pet.floorY();
  overlay.frame(1 / 60);
  check('落回地面后高位没有残留', alphaAt(overlay.pet.x, midTop) === 0, 'alpha=' + alphaAt(overlay.pet.x, midTop));
  check('地面位置有像素', alphaAt(overlay.pet.x, y) > 0, 'alpha=' + alphaAt(overlay.pet.x, y));

  /* ---------------- 4. 立绘画风同样要清屏 ---------------- */
  emit('');
  emit('=== 4. 立绘画风 ===');
  overlay.setArtStyle('musume');
  var rng2 = overlay.pet.xRange();
  var xC = rng2.min + 40, xD = rng2.max - 40;
  var yC = Math.round(overlay.pet.floorY() - 120);

  setTimeout(function () {
    var st = overlay.artStatus();
    emit('# 立绘状态：' + JSON.stringify(st));
    overlay.pet.x = xC; overlay.pet.y = overlay.pet.floorY();
    overlay.frame(1 / 60);
    var onSprite = alphaAt(overlay.pet.x, yC);
    check('立绘画风：她能画出来（' + (st.ready ? '立绘' : '像素回退') + '）', onSprite > 0, 'alpha=' + onSprite);

    overlay.pet.x = xD;      // 搬走
    overlay.frame(1 / 60);
    check('立绘画风：搬走后旧位置透明（无重影）', alphaAt(xC, yC) === 0, 'alpha=' + alphaAt(xC, yC));
    check('立绘画风：新位置有像素', alphaAt(xD, yC) > 0, 'alpha=' + alphaAt(xD, yC));

    // 隐藏 / 唤回 也不该留下旧帧
    overlay.setHidden(true);
    overlay.frame(1 / 60);
    overlay.setHidden(false);
    overlay.frame(1 / 60);
    check('隐藏再唤回后画面依旧干净', alphaAt(xD, yC) > 0, 'alpha=' + alphaAt(xD, yC));

    overlay.destroy();
    flush();
  }, 2500);

  window.__ghostDebug = overlay;
  flush();   // 先出一版中间结果，异步部分跑完再出最终版
})();
</script>
</body>
</html>
