<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>像素鲸鱼娘 · 独立演示（不装插件也能玩）</title>
<link rel="stylesheet" href="../assets/whale-pet.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { font: 13px/1.6 "Segoe UI", "Microsoft YaHei", sans-serif; color: #dce9f7;
    background: radial-gradient(120% 90% at 72% 8%, #1b3a5c 0%, #12212f 55%, #0c1620 100%); }
  .doc { padding: 26px 34px; max-width: 640px; }
  .doc h1 { font-size: 18px; margin: 0 0 8px; color: #9fe6ff; }
  .doc p { color: #93aec7; margin: 5px 0; }
  .doc code { background: rgba(127,212,255,.12); padding: 1px 5px; border-radius: 4px; color: #cfe9ff; }
  .sim { position: fixed; left: 34px; bottom: 24px; display: flex; gap: 8px; flex-wrap: wrap; max-width: 660px; }
  .sim button { padding: 7px 12px; border: 1px solid rgba(160,200,240,.25); border-radius: 9px;
    background: rgba(255,255,255,.04); color: #dce9f7; cursor: pointer; font-size: 12.5px; }
  .sim button:hover { background: rgba(127,212,255,.14); }
  .sim button.on { border-color: #7fd4ff; color: #7fd4ff; }
  .card { position: fixed; right: 34px; top: 24px; width: 300px; padding: 14px 16px;
    border: 1px solid rgba(160,200,240,.18); border-radius: 14px; background: rgba(16,28,40,.72); backdrop-filter: blur(8px); }
  .card h2 { margin: 0 0 8px; font-size: 13px; color: #9fe6ff; }
  .card div { color: #93aec7; font-size: 12px; line-height: 1.7; }
  .card b { color: #dce9f7; font-weight: 600; }
  .ground { position: fixed; left: 0; right: 0; bottom: 88px; height: 1px; background: rgba(127,212,255,.18); }
</style>
</head>
<body>
<div class="doc">
  <h1>🐋 鲸鱼娘桌宠 · 独立演示</h1>
  <p>这一页用的是和 DSH 插件里<strong>完全相同</strong>的引擎与悬浮层，只是把「宿主信号」换成了下面的按钮手动模拟。</p>
  <p>拖动她搬家 · 单击摸头（头/肚子/尾巴反应不同）· 右键更多操作 · 面板里可换画风/换装改名。</p>
  <p>URL 参数：<code>?sig=working&amp;art=pixel&amp;panel=1&amp;skin=coral&amp;x=300</code></p>
  <p>注意：她只浮在窗口内，不会挡住页面上的按钮与文字。</p>
</div>

<div class="ground"></div>

<div class="card">
  <h2>状态自检</h2>
  <div id="stat">加载中…</div>
</div>

<div class="sim">
  <button data-sig="idle">待机 idle</button>
  <button data-sig="thinking">思考 thinking</button>
  <button data-sig="working">干活 working</button>
  <button data-sig="approval">待审批 approval</button>
  <button data-sig="error">出错 error</button>
  <button id="panel-btn">面板</button>
  <button id="hide-btn">隐藏 / 唤回</button>
</div>

<script src="../assets/whale-pet.js"></script>
<script src="../assets/pet-actions.js"></script>
<script src="../assets/art-musume.js"></script>
<script src="../assets/whale-pet-overlay.js"></script>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var overlay = window.WhalePetOverlay.createOverlay({
    storageKey: 'whale-pet:demo',
    assetBase: '../assets/',        // 立绘资源目录（演示页直接走相对路径）
    config: {
      skin: q.get('skin') || 'deep',
      art: q.get('art') || 'musume',
      guiPet: true,
      sound: false, name: '小汐', hidden: q.get('hidden') === '1'
    }
  });
  // 演示页不落盘，避免和真实插件的存档互相污染
  overlay.load = function () { return this; };
  overlay.save = function () { return {}; };

  overlay.mount();
  overlay.start();
  if (q.get('x')) overlay.pet.x = Number(q.get('x'));

  var sig = q.get('sig') || 'idle';
  overlay.signal(sig);
  if (q.get('panel') === '1') { overlay.togglePanel(true); overlay.sync(true); }
  if (q.get('pat') === '1') overlay.pet.pat(q.get('zone') || 'head');
  if (q.get('feed') === '1') overlay.pet.feed();
  if (q.get('tokens')) overlay.pet.addTokens(Number(q.get('tokens')));

  Array.prototype.forEach.call(document.querySelectorAll('.sim button[data-sig]'), function (b) {
    if (b.getAttribute('data-sig') === sig) b.classList.add('on');
    b.addEventListener('click', function () {
      Array.prototype.forEach.call(document.querySelectorAll('.sim button[data-sig]'), function (o) { o.classList.remove('on'); });
      b.classList.add('on');
      overlay.signal(b.getAttribute('data-sig'));
    });
  });
  document.getElementById('panel-btn').addEventListener('click', function () { overlay.togglePanel(); });
  document.getElementById('hide-btn').addEventListener('click', function () { overlay.setHidden(!overlay.cfg.hidden); });

  window.__whalePetDebug = overlay;   // 排查与自动化都用它

  var stat = document.getElementById('stat');
  setInterval(function () {
    var s = overlay.stats();
    stat.innerHTML =
      '姿势 <b>' + s.pose + '</b>（mode ' + s.mode + ' / 信号 ' + s.ambient + '）<br>' +
      '位置 <b>' + s.x + ', ' + s.y + '</b>　朝向 <b>' + (s.facing > 0 ? '右' : '左') + '</b><br>' +
      'Lv.<b>' + s.level + '</b>　心情 <b>' + s.mood + '</b>　饱食 <b>' + s.hunger + '</b>　精力 <b>' + s.energy + '</b><br>' +
      '画风 <b>' + s.art + '</b>（已载入 ' + s.artLoaded + '/' + s.artTotal + '）　' +
      '立绘 <b>' + (s.artFile || '—') + '</b><br>' +
      '累计 Token <b>' + s.tokens.toLocaleString() + '</b>';
  }, 200);
})();
</script>
</body>
</html>
