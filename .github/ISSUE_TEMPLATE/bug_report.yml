name: Bug report
description: Something broke — she crashed, vanished, blocked clicks, or the layout got pushed around
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. A few details up front save a round trip — especially **which form**
        you are running (the in-window pet and the standalone desktop window are different code paths).
  - type: dropdown
    id: form
    attributes:
      label: Which form?
      options:
        - Desktop window (standalone Electron app)
        - In-window overlay (inside the DSH window)
        - Both
        - Not sure
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: DSH version, Electron version (desktop form), OS
      placeholder: "DSH 0.2.0-rc.2 · Electron 43.1.1 · Windows 11 26100"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Right-click her
        2. Pick 散步 (walk)
        3. ...
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: |
        Paste whatever you can from these — they answer most questions immediately.
      value: |
        - `window.__dshWhalePixelPetBooted` (in-window form, DSH devtools console)
        - `window.__dshWhalePixelPet.stats()`
        - `window.__dshWhalePixelPet.diagnose()` (layout self-check)
        - `%LOCALAPPDATA%\dsh-whale-pet\state.json` (desktop form — **redact if it names your work**)
        - Any `[dsh-whale-pixel-pet]` warnings in the console
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I reloaded the DSH window (Ctrl+F5) and, for host-half issues, restarted DSH
          required: true
        - label: I searched existing issues
          required: true
