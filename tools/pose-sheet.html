<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>鲸鱼娘 · 姿态总览（美术校对用）</title>
<style>
  html, body { margin: 0; padding: 0; background: #0e1622; color: #cfe0ff;
    font: 13px/1.4 "Segoe UI", "Microsoft YaHei", monospace; }
  #wrap { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px; }
  .cell { width: 256px; background: #16202e; border-radius: 10px; padding: 6px 0 2px; text-align: center; }
  .cell canvas { display: block; margin: 0 auto; }
  .cap { font-size: 12px; color: #8fb0d8; padding-top: 2px; }
  h1 { font-size: 14px; margin: 8px 12px 0; color: #7fd4ff; font-weight: 600; }
</style>
</head>
<body>
<h1 id="title">鲸鱼娘姿态总览</h1>
<div id="wrap"></div>

<script src="../assets/whale-pet.js"></script>
<script>
(function () {
  var W = window.WhalePet;
  var q = new URLSearchParams(location.search);
  var skins = (q.get('skins') || 'deep').split(',').filter(Boolean);
  var poses = (q.get('poses') || 'idle,work,think,approve,happy,eat,drag,sleep,sad,levelup').split(',').filter(Boolean);
  var CELL = 256, U = 7;

  // 每种姿势要打开的开关（和引擎里的 pose 分支一一对应）
  var FLAG = {
    work: { laptop: true },
    eat: { snack: true, chew: true },
    approve: { alert: true },
    happy: { blush: true },
    levelup: { blush: true },
    sad: { sad: true, droop: 0.7, expr: 'half' },
    sleep: { spout: false },
    drag: {},
    idle: { spout: true },
    think: { spout: true }
  };
  var EXPR = { sleep: 'sleep', drag: 'wide', happy: 'closed', levelup: 'heart', sad: 'half' };

  document.getElementById('title').textContent =
    '鲸鱼娘姿态总览 · 皮肤 [' + skins.join(',') + '] · 单位 ' + U + 'px';

  var wrap = document.getElementById('wrap');
  poses.forEach(function (pose) {
    skins.forEach(function (skin) {
      var cell = document.createElement('div');
      cell.className = 'cell';
      var cv = document.createElement('canvas');
      cv.width = CELL; cv.height = CELL;
      cell.appendChild(cv);
      var cap = document.createElement('div');
      cap.className = 'cap';
      cap.textContent = pose + ' · ' + (W.SKINS[skin] ? W.SKINS[skin].name : skin);
      cell.appendChild(cap);
      wrap.appendChild(cell);

      var ctx = cv.getContext('2d');
      ctx.fillStyle = '#101a26';
      ctx.fillRect(0, 0, CELL, CELL);
      ctx.strokeStyle = 'rgba(127,212,255,0.07)';
      for (var gx = 0; gx < CELL; gx += U) { ctx.beginPath(); ctx.moveTo(gx + .5, 0); ctx.lineTo(gx + .5, CELL); ctx.stroke(); }
      for (var gy = 0; gy < CELL; gy += U) { ctx.beginPath(); ctx.moveTo(0, gy + .5); ctx.lineTo(CELL, gy + .5); ctx.stroke(); }

      var floorY = CELL - 26;
      ctx.fillStyle = 'rgba(127,212,255,0.18)';
      ctx.fillRect(0, floorY, CELL, 1);

      var f = FLAG[pose] || {};
      var pen = new W.PixelPen(U);
      pen.anchorX = 12.5;
      W.drawWhale(pen, {
        skin: skin, pose: pose, t: 0.35, phase: 0.8, tailPhase: 1.2,
        lookX: 0.5, lookY: 0.1,
        expr: f.expr || EXPR[pose] || 'normal',
        spout: pose !== 'sleep', finFlap: 0.4,
        chew: !!f.chew, laptop: !!f.laptop, snack: !!f.snack, alert: !!f.alert,
        sad: !!f.sad, droop: f.droop || 0, blush: !!f.blush
      });
      pen.flushAt(ctx, 128, floorY);
    });
  });
})();
</script>
</body>
</html>
